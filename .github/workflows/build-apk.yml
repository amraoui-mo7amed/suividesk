name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install npm dependencies
        run: npm install

      - name: Build web application
        run: npm run build:vite

      - name: Sync web assets with Capacitor Android
        run: npx cap sync android

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build Android APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK for Release
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/SuiviDesk-1.5.0.apk
          ls -lh release/SuiviDesk-1.5.0.apk

      - name: Upload APK Artifact to GitHub Run
        uses: actions/upload-artifact@v4
        with:
          name: SuiviDesk-Android-APK
          path: release/SuiviDesk-1.5.0.apk

      - name: Upload APK to GitHub Release v1.5.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          if [ -z "$TAG" ] || [ "$TAG" = "main" ]; then
            TAG="v$(node -p "require('./package.json').version")"
          fi
          echo "Uploading SuiviDesk-1.5.0.apk to GitHub Release: $TAG"
          gh release upload "$TAG" release/SuiviDesk-1.5.0.apk --clobber
